<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 572" width="1080" height="572">
  <title>The architecture: one pure core, thin everything else</title>
  <style>
    :root {
      --surface: #ffffff; --ground: #f3f4f0; --ink: #17202b; --ink-2: #3b4755; --muted: #5a6570;
      --line: #cfd5cc; --line-2: #8a96a5;
      --cobalt: #2944a8; --cobalt-soft: #e9edf8; --amber: #a84f07; --amber-soft: #f7ebe0;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #161b22; --ground: #0f1318; --ink: #e2e6eb; --ink-2: #b6c1cd; --muted: #98a2ad;
        --line: #2c333d; --line-2: #627082;
        --cobalt: #8fa3f5; --cobalt-soft: #1c2440; --amber: #f0a24e; --amber-soft: #2b2015;
      }
    }
    .bg { fill: var(--surface); stroke: var(--line); }
    .box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.1; }
    .box-in { fill: var(--ground); stroke: var(--line-2); stroke-width: 1; }
    .box-ink { fill: var(--surface); stroke: var(--ink); stroke-width: 1.75; }
    .box-cob { fill: var(--cobalt-soft); stroke: var(--cobalt); stroke-width: 1.5; }
    .box-amb { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.2; }
    .pill { fill: var(--surface); stroke: var(--cobalt); stroke-width: 1; }
    .scope { fill: none; stroke: var(--amber); stroke-width: 1.4; stroke-dasharray: 6 4; }
    .keep { fill: none; stroke: var(--line-2); stroke-width: 1.1; stroke-dasharray: 5 4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
    .e-cob { fill: none; stroke: var(--cobalt); stroke-width: 1.9; }
    .e-amb { fill: none; stroke: var(--amber); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .e-mut { fill: none; stroke: var(--line-2); stroke-width: 1.3; stroke-dasharray: 3 4; }
    .mk { fill: var(--ink-2); }
    .mk-cob { fill: var(--cobalt); }
    .mk-amb { fill: var(--amber); }
    .mk-mut { fill: var(--line-2); }
    .th { font: 600 15px var(--font-body); fill: var(--ink); }
    .tt { font: 600 13px var(--font-body); fill: var(--ink); }
    .tb { font: 600 12px var(--font-body); fill: var(--ink); }
    .tr { font: 400 11.5px var(--font-body); fill: var(--ink); }
    .ts { font: 400 11px var(--font-body); fill: var(--muted); }
    .tm { font: 400 11px var(--font-mono); fill: var(--muted); }
    .tmb { font: 600 13px var(--font-mono); fill: var(--ink); }
    .tbig { font: 600 15px var(--font-mono); fill: var(--ink); }
    .tcore { font: 700 18px var(--font-mono); fill: var(--cobalt); }
    .tz { font: 500 10.5px var(--font-mono); letter-spacing: 0.06em; fill: var(--muted); }
    .cob { fill: var(--cobalt); }
    .amb { fill: var(--amber); }
    /* Edge labels carry a halo in the colour beneath them, so a line under the text does not strike through it. */
    .te { font: 400 11px var(--font-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .te.cob { fill: var(--cobalt); }
    .te.amb { fill: var(--amber); }
  </style>
  <defs>
    <marker id="f1-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="f1-cob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-cob" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="f1-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-amb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1079" height="571" rx="10"/>

  <!-- UI -->
  <rect class="box" x="360" y="16" width="360" height="58" rx="6"/>
  <text class="tt" x="540" y="39" text-anchor="middle">Svelte UI <tspan class="tm">TypeScript</tspan></text>
  <text class="ts" x="540" y="59" text-anchor="middle">pages ported from today's UI · dag-map</text>
  <path class="e" d="M540,74 V108" marker-end="url(#f1-ink)"/>
  <text class="te" x="552" y="95">HTTP · WebSocket</text>

  <!-- binary -->
  <rect class="box-ink" x="40" y="112" width="1000" height="68" rx="6"/>
  <text class="tbig" x="58" y="140">flowtime</text>
  <text class="ts" x="58" y="161">one Rust binary · parses arguments and requests, calls the libraries</text>
  <rect class="box" x="560" y="128" width="120" height="36" rx="5"/>
  <text class="tb" x="620" y="151" text-anchor="middle">CLI</text>
  <rect class="box" x="696" y="128" width="148" height="36" rx="5"/>
  <text class="tb" x="770" y="151" text-anchor="middle">HTTP API</text>
  <rect class="box" x="860" y="128" width="164" height="36" rx="5"/>
  <text class="tb" x="942" y="151" text-anchor="middle">WebSocket session</text>

  <!-- binary to libraries, and straight to core for plain models -->
  <path class="e" d="M200,180 V228" marker-end="url(#f1-ink)"/>
  <path class="e" d="M540,180 V228" marker-end="url(#f1-ink)"/>
  <path class="e" d="M880,180 V228" marker-end="url(#f1-ink)"/>
  <path class="e" d="M370,180 V368" marker-end="url(#f1-ink)"/>
  <text class="te" x="210" y="208">calls</text>

  <!-- libraries -->
  <rect class="box" x="40" y="232" width="320" height="80" rx="6"/>
  <text class="tmb" x="56" y="256">templates</text>
  <text class="tr" x="56" y="276">template → model</text>
  <text class="ts" x="56" y="294">typed parameters; sugar lowered once</text>
  <rect class="box" x="380" y="232" width="320" height="80" rx="6"/>
  <text class="tmb" x="396" y="256">analysis</text>
  <text class="tr" x="396" y="276">sweep · sensitivity · goal-seek · optimize</text>
  <text class="ts" x="396" y="294">loops over evaluate-with-overrides</text>
  <rect class="box" x="720" y="232" width="320" height="80" rx="6"/>
  <text class="tmb" x="736" y="256">runs</text>
  <text class="tr" x="736" y="276">run folder write and read</text>
  <text class="ts" x="736" y="294">content-hashed run id · one series format</text>

  <!-- libraries to core -->
  <path class="e" d="M200,312 V368" marker-end="url(#f1-ink)"/>
  <path class="e" d="M540,312 V368" marker-end="url(#f1-ink)"/>
  <path class="e" d="M880,312 V368" marker-end="url(#f1-ink)"/>
  <text class="te" x="210" y="344">uses</text>
  <text class="te" x="378" y="344">plain models</text>

  <!-- core -->
  <rect class="box-cob" x="40" y="372" width="1000" height="104" rx="8"/>
  <text class="tcore" x="58" y="400">core</text>
  <text class="ts" x="118" y="399">pure library · no files, no network, no clock · the essence</text>
  <rect class="pill" x="66" y="418" width="180" height="38" rx="5"/>
  <text class="tb" x="156" y="442" text-anchor="middle">model types</text>
  <rect class="pill" x="258" y="418" width="180" height="38" rx="5"/>
  <text class="tb" x="348" y="442" text-anchor="middle">validate</text>
  <rect class="pill" x="450" y="418" width="180" height="38" rx="5"/>
  <text class="tb" x="540" y="442" text-anchor="middle">compile → plan</text>
  <rect class="pill" x="642" y="418" width="180" height="38" rx="5"/>
  <text class="tb" x="732" y="442" text-anchor="middle">evaluate per bin</text>
  <rect class="pill" x="834" y="418" width="180" height="38" rx="5"/>
  <text class="tb" x="924" y="442" text-anchor="middle">metrics · invariants</text>
  <path class="e-cob" d="M247,437 H256" marker-end="url(#f1-cob)"/>
  <path class="e-cob" d="M439,437 H448" marker-end="url(#f1-cob)"/>
  <path class="e-cob" d="M631,437 H640" marker-end="url(#f1-cob)"/>
  <path class="e-cob" d="M823,437 H832" marker-end="url(#f1-cob)"/>

  <!-- oracle: a different scope, never shipped -->
  <rect class="scope" x="40" y="500" width="1000" height="56" rx="8"/>
  <text class="tt amb" x="58" y="524">oracle, in Python, never shipped</text>
  <text class="ts" x="58" y="543">closed forms · laws · reference evaluator · simulation · generators · all run by ./verify</text>
  <path class="e-amb" d="M1040,528 H1060 V146 H1044" marker-end="url(#f1-amb)"/>
  <text class="te amb" transform="translate(1073,340) rotate(-90)" text-anchor="middle">checks through the CLI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300">
  <title>One run, end to end</title>
  <style>
    :root {
      --surface: #ffffff; --ground: #f3f4f0; --ink: #17202b; --ink-2: #3b4755; --muted: #5a6570;
      --line: #cfd5cc; --line-2: #8a96a5;
      --cobalt: #2944a8; --cobalt-soft: #e9edf8; --amber: #a84f07; --amber-soft: #f7ebe0;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #161b22; --ground: #0f1318; --ink: #e2e6eb; --ink-2: #b6c1cd; --muted: #98a2ad;
        --line: #2c333d; --line-2: #627082;
        --cobalt: #8fa3f5; --cobalt-soft: #1c2440; --amber: #f0a24e; --amber-soft: #2b2015;
      }
    }
    .bg { fill: var(--surface); stroke: var(--line); }
    .box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.1; }
    .box-in { fill: var(--ground); stroke: var(--line-2); stroke-width: 1; }
    .box-ink { fill: var(--surface); stroke: var(--ink); stroke-width: 1.75; }
    .box-cob { fill: var(--cobalt-soft); stroke: var(--cobalt); stroke-width: 1.5; }
    .box-amb { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.2; }
    .pill { fill: var(--surface); stroke: var(--cobalt); stroke-width: 1; }
    .scope { fill: none; stroke: var(--amber); stroke-width: 1.4; stroke-dasharray: 6 4; }
    .keep { fill: none; stroke: var(--line-2); stroke-width: 1.1; stroke-dasharray: 5 4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
    .e-cob { fill: none; stroke: var(--cobalt); stroke-width: 1.9; }
    .e-amb { fill: none; stroke: var(--amber); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .e-mut { fill: none; stroke: var(--line-2); stroke-width: 1.3; stroke-dasharray: 3 4; }
    .mk { fill: var(--ink-2); }
    .mk-cob { fill: var(--cobalt); }
    .mk-amb { fill: var(--amber); }
    .mk-mut { fill: var(--line-2); }
    .th { font: 600 15px var(--font-body); fill: var(--ink); }
    .tt { font: 600 13px var(--font-body); fill: var(--ink); }
    .tb { font: 600 12px var(--font-body); fill: var(--ink); }
    .tr { font: 400 11.5px var(--font-body); fill: var(--ink); }
    .ts { font: 400 11px var(--font-body); fill: var(--muted); }
    .tm { font: 400 11px var(--font-mono); fill: var(--muted); }
    .tmb { font: 600 13px var(--font-mono); fill: var(--ink); }
    .tbig { font: 600 15px var(--font-mono); fill: var(--ink); }
    .tcore { font: 700 18px var(--font-mono); fill: var(--cobalt); }
    .tz { font: 500 10.5px var(--font-mono); letter-spacing: 0.06em; fill: var(--muted); }
    .cob { fill: var(--cobalt); }
    .amb { fill: var(--amber); }
    /* Edge labels carry a halo in the colour beneath them, so a line under the text does not strike through it. */
    .te { font: 400 11px var(--font-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .te.cob { fill: var(--cobalt); }
    .te.amb { fill: var(--amber); }
  </style>
  <defs>
    <marker id="f2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="f2-cob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk-cob" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="f2-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk-amb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1079" height="299" rx="10"/>

  <!-- diagnostics flow back to the template -->
  <path class="e-amb" d="M646,60 V38 H86 V56" marker-end="url(#f2-amb)"/>
  <text class="te amb" x="366" y="31" text-anchor="middle">diagnostics name the template line and the parameter</text>

  <!-- stages -->
  <rect class="box-in" x="16" y="60" width="140" height="80" rx="6"/>
  <text class="tmb" x="30" y="88">template.yaml</text>
  <text class="ts" x="30" y="106">+ parameter values</text>

  <rect class="box" x="196" y="60" width="190" height="80" rx="6"/>
  <text class="tmb" x="210" y="82">templates: lower</text>
  <text class="ts" x="210" y="100">bind typed parameters</text>
  <text class="ts" x="210" y="116">self → backlog row</text>
  <text class="ts" x="210" y="132">edge weights → router</text>

  <rect class="box-ink" x="426" y="60" width="120" height="80" rx="6"/>
  <text class="tmb" x="440" y="88">model</text>
  <text class="ts" x="440" y="106">every series</text>
  <text class="ts" x="440" y="122">declared once</text>

  <rect class="box-cob" x="586" y="60" width="120" height="80" rx="6"/>
  <text class="tt cob" x="600" y="84">validate</text>
  <text class="ts" x="600" y="102">schema</text>
  <text class="ts" x="600" y="117">references</text>
  <text class="ts" x="600" y="132">one authority</text>

  <rect class="box-cob" x="746" y="60" width="130" height="80" rx="6"/>
  <text class="tt cob" x="760" y="88">compile</text>
  <text class="ts" x="760" y="106">plan +</text>
  <text class="ts" x="760" y="122">parameter table</text>

  <rect class="box-cob" x="916" y="60" width="150" height="80" rx="6"/>
  <text class="tt cob" x="930" y="88">evaluate</text>
  <text class="ts" x="930" y="106">bin by bin</text>
  <text class="ts" x="930" y="122">metrics · invariants</text>

  <path class="e" d="M156,100 H192" marker-end="url(#f2-ink)"/>
  <path class="e" d="M386,100 H422" marker-end="url(#f2-ink)"/>
  <path class="e" d="M546,100 H582" marker-end="url(#f2-ink)"/>
  <path class="e" d="M706,100 H742" marker-end="url(#f2-ink)"/>
  <path class="e" d="M876,100 H912" marker-end="url(#f2-ink)"/>

  <!-- where a result goes -->
  <path class="e" d="M940,140 V184"/>
  <path class="e" d="M640,184 H980"/>
  <path class="e" d="M640,184 V218" marker-end="url(#f2-ink)"/>
  <path class="e" d="M820,184 V218" marker-end="url(#f2-ink)"/>
  <path class="e" d="M980,184 V218" marker-end="url(#f2-ink)"/>

  <rect class="box-in" x="560" y="222" width="160" height="62" rx="6"/>
  <text class="tmb" x="574" y="246">run folder</text>
  <text class="ts" x="574" y="266">stored result</text>
  <rect class="box-in" x="740" y="222" width="160" height="62" rx="6"/>
  <text class="tmb" x="754" y="246">session</text>
  <text class="ts" x="754" y="266">UI what-if</text>
  <rect class="box-in" x="920" y="222" width="146" height="62" rx="6"/>
  <text class="tmb" x="934" y="246">analysis</text>
  <text class="ts" x="934" y="266">sweep, optimize …</text>

  <!-- analysis re-evaluates the same compiled plan -->
  <path class="e-cob" d="M1052,222 V146" marker-end="url(#f2-cob)"/>
  <text class="te cob" x="1044" y="160" text-anchor="end">re-evaluate,</text>
  <text class="te cob" x="1044" y="174" text-anchor="end">no recompile</text>
</svg>
